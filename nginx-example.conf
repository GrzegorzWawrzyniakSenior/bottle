# Nginx Configuration Example for zgranegrono.pl
# This fixes the "upstream timed out" error

# Define upstream with correct address (127.0.0.1, NOT 0.0.0.0)
upstream bottle_logger {
    server 127.0.0.1:8082 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name zgranegrono.pl www.zgranegrono.pl;
    
    # Redirect to HTTPS (if you have SSL)
    # return 301 https://$server_name$request_uri;
    
    # OR handle HTTP traffic:
    
    # Frontend config endpoint - heavily cached
    location /frontend-config {
        proxy_pass http://bottle_logger;
        
        # Connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts (adjust as needed)
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # Enable nginx caching (optional but recommended)
        # proxy_cache bottle_cache;
        # proxy_cache_valid 200 60s;
        # proxy_cache_use_stale error timeout updating;
        # proxy_cache_background_update on;
        # proxy_cache_lock on;
        # add_header X-Cache-Status $upstream_cache_status;
        
        # CORS headers (already set by backend, but can add as fallback)
        # add_header Access-Control-Allow-Origin "*" always;
    }
    
    # Logging endpoints - no caching
    location ~ ^/log/?$ {
        proxy_pass http://bottle_logger;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Longer timeout for POST requests with data
        proxy_connect_timeout 15s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        
        # No caching for logging
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        
        # Limit to local network only (optional security)
        # allow 127.0.0.1;
        # allow 192.168.0.0/16;
        # deny all;
    }
    
    # Your other application locations
    location / {
        # Your frontend or other backend
        root /var/www/html;
        try_files $uri $uri/ /index.html;
    }
}

# If using HTTPS (recommended)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zgranegrono.pl www.zgranegrono.pl;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/zgranegrono.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zgranegrono.pl/privkey.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Same locations as above
    location /frontend-config {
        proxy_pass http://bottle_logger;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }
    
    location ~ ^/log/?$ {
        proxy_pass http://bottle_logger;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location / {
        root /var/www/html;
        try_files $uri $uri/ /index.html;
    }
}
